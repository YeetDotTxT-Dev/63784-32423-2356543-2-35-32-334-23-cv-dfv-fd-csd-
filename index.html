<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnix Script Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(145deg, #12121a, #1a1a2e);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }
        .logo h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span {
            font-size: 12px;
            color: #6b7280;
            display: block;
            margin-top: -2px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34,197,94,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-badge span { font-size: 12px; color: #22c55e; font-weight: 500; }
        .search-bar {
            position: relative;
            margin-bottom: 25px;
        }
        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .search-bar input:focus {
            border-color: rgba(124,58,237,0.4);
            background: rgba(255,255,255,0.06);
        }
        .search-bar input::placeholder { color: #4b5563; }
        .search-bar i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #4b5563;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: transparent;
            color: #6b7280;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab:hover {
            background: rgba(255,255,255,0.04);
            color: #d1d5db;
        }
        .tab.active {
            background: rgba(124,58,237,0.15);
            border-color: rgba(124,58,237,0.3);
            color: #a78bfa;
        }
        .scripts-grid {
            display: grid;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .scripts-grid::-webkit-scrollbar { width: 4px; }
        .scripts-grid::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 10px; }
        .script-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s;
        }
        .script-card:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.08);
            transform: translateX(4px);
        }
        .script-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }
        .script-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .script-icon.aimbot { background: rgba(34,197,94,0.15); color: #22c55e; }
        .script-icon.esp { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .script-icon.admin { background: rgba(239,68,68,0.15); color: #ef4444; }
        .script-name {
            font-size: 14px;
            font-weight: 500;
            color: #e5e7eb;
        }
        .script-desc {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        .script-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-copy {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(124,58,237,0.15);
            color: #a78bfa;
        }
        .btn-copy:hover { background: rgba(124,58,237,0.25); }
        .btn-load {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(34,197,94,0.15);
            color: #22c55e;
        }
        .btn-load:hover { background: rgba(34,197,94,0.25); }
        .footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #4b5563;
        }
        .footer-stats { display: flex; gap: 20px; }
        .footer-stats span { display: flex; align-items: center; gap: 6px; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(16,16,26,0.95);
            border: 1px solid rgba(255,255,255,0.06);
            color: #e5e7eb;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i { margin-right: 10px; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .script-card { flex-wrap: wrap; gap: 10px; }
            .script-actions { width: 100%; justify-content: flex-end; }
            .tabs { gap: 4px; }
            .tab { font-size: 11px; padding: 6px 12px; }
            .footer { flex-direction: column; gap: 10px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-terminal"></i></div>
                <div>
                    <h1>Omnix Script Hub</h1>
                    <span>Premium Roblox Scripts</span>
                </div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Live</span>
            </div>
        </div>
        
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search scripts..." oninput="filterScripts()">
        </div>
        
        <div class="tabs" id="tabContainer">
            <button class="tab active" data-category="all" onclick="filterCategory('all')">All</button>
            <button class="tab" data-category="aimbot" onclick="filterCategory('aimbot')">Aimbot</button>
            <button class="tab" data-category="esp" onclick="filterCategory('esp')">ESP</button>
            <button class="tab" data-category="admin" onclick="filterCategory('admin')">Admin</button>
        </div>
        
        <div class="scripts-grid" id="scriptsContainer"></div>
        
        <div class="footer">
            <div class="footer-stats">
                <span><i class="fas fa-code"></i> <span id="scriptCount">0</span> scripts</span>
                <span><i class="fas fa-eye"></i> <span id="visibleCount">0</span> loaded</span>
            </div>
            <div>v2.0 · <i class="fas fa-github"></i> GitHub</div>
        </div>
    </div>
    
    <div class="toast" id="toast">
        <i class="fas fa-check-circle" style="color: #22c55e;"></i>
        <span id="toastMessage">Copied!</span>
    </div>

    <script>
        // ============================================================
        // ─── SCRIPT DATABASE ──────────────────────────────────────────
        // ─── ONLY 3 SCRIPTS - EASY TO ADD MORE ──────────────────────
        // ============================================================
        
        // REPLACE "YOUR-USERNAME" with your GitHub username
        const BASE_URL = "https://raw.githubusercontent.com/YOUR-USERNAME/omnix-script-hub/main/raw/";
        
        const scripts = [
            {
                id: 1,
                name: "Ares Aimbot V4",
                desc: "Advanced aimbot with prediction & silent aim",
                category: "aimbot",
                icon: "fa-crosshairs",
                iconClass: "aimbot",
                raw: BASE_URL + "aimbot.lua"
            },
            {
                id: 2,
                name: "Advanced ESP",
                desc: "Full ESP with team colors and visibility",
                category: "esp",
                icon: "fa-eye",
                iconClass: "esp",
                raw: BASE_URL + "esp.lua"
            },
            {
                id: 3,
                name: "Omnix Admin Suite",
                desc: "Complete admin system with 150+ commands",
                category: "admin",
                icon: "fa-shield-halved",
                iconClass: "admin",
                raw: BASE_URL + "admin.lua"
            },
        ];

        // ============================================================
        // ─── RENDER ──────────────────────────────────────────────────
        // ============================================================

        let currentCategory = 'all';
        let currentSearch = '';

        function renderScripts() {
            const container = document.getElementById('scriptsContainer');
            container.innerHTML = '';
            
            const filtered = scripts.filter(script => {
                const matchesCategory = currentCategory === 'all' || script.category === currentCategory;
                const matchesSearch = script.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                                     script.desc.toLowerCase().includes(currentSearch.toLowerCase());
                return matchesCategory && matchesSearch;
            });
            
            document.getElementById('scriptCount').textContent = scripts.length;
            document.getElementById('visibleCount').textContent = filtered.length;
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px 0;color:#4b5563;">
                        <i class="fas fa-search" style="font-size:24px;display:block;margin-bottom:12px;"></i>
                        No scripts found
                    </div>
                `;
                return;
            }
            
            filtered.forEach(script => {
                const card = document.createElement('div');
                card.className = 'script-card';
                
                card.innerHTML = `
                    <div class="script-info">
                        <div class="script-icon ${script.iconClass}">
                            <i class="fas ${script.icon}"></i>
                        </div>
                        <div>
                            <div class="script-name">${script.name}</div>
                            <div class="script-desc">${script.desc}</div>
                        </div>
                    </div>
                    <div class="script-actions">
                        <button class="btn-load" onclick="loadScript(${script.id})">
                            <i class="fas fa-play"></i> Load
                        </button>
                        <button class="btn-copy" onclick="copyScript(${script.id})">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // ============================================================
        // ─── FILTERS ──────────────────────────────────────────────────
        // ============================================================

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === category);
            });
            renderScripts();
        }

        function filterScripts() {
            currentSearch = document.getElementById('searchInput').value;
            renderScripts();
        }

        // ============================================================
        // ─── SCRIPT ACTIONS ──────────────────────────────────────────
        // ============================================================

        function loadScript(id) {
            const script = scripts.find(s => s.id === id);
            if (!script) return;
            
            const loadCommand = `loadstring(game:HttpGet("${script.raw}", true))()`;
            navigator.clipboard.writeText(loadCommand).then(() => {
                showToast('✅ Load command copied! Paste in executor');
            });
            
            console.log(`Script: ${script.name}`);
            console.log(`Load command: ${loadCommand}`);
        }

        function copyScript(id) {
            const script = scripts.find(s => s.id === id);
            if (!script) return;
            
            navigator.clipboard.writeText(script.raw).then(() => {
                showToast('✅ Raw URL copied!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = script.raw;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Raw URL copied!');
            });
        }

        // ============================================================
        // ─── TOAST ────────────────────────────────────────────────────
        // ============================================================

        let toastTimeout;

        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            
            msgEl.textContent = message;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // ─── INIT ────────────────────────────────────────────────────
        // ============================================================

        renderScripts();

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });
    </script>
</body>
</html>
